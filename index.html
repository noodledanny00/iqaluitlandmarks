<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iqaluit Landmarks Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    .info-header {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .info-header h1 {
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="info-header">
    <h1>Iqaluit Landmarks & Notable Spots</h1>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Initialize map centered on Iqaluit
    const map = L.map('map').setView([63.7467, -68.5170], 13);

    // Add OpenStreetMap base tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // List of landmarks in Iqaluit with coordinates and descriptions
    const landmarks = [
      {
        name: "St. Jude's Anglican Cathedral (Igloo Cathedral)",
        lat: 63.7486,
        lng: -68.5186,
        category: "Iconic Landmark",
        description: "The famous igloo-shaped cathedral located in central Iqaluit."
      },
      {
        name: "Legislative Assembly of Nunavut",
        lat: 63.7488,
        lng: -68.5147,
        category: "Government",
        description: "Home to Nunavut's government, featuring traditional Inuit architectural elements."
      },
      {
        name: "Iqaluit International Airport (YFB)",
        lat: 63.7564,
        lng: -68.5558,
        category: "Transportation",
        description: "Distinct bright yellow terminal building and major northern transit hub."
      },
      {
        name: "Sylvia Grinnell Territorial Park",
        lat: 63.7431,
        lng: -68.5683,
        category: "Nature",
        description: "Scenic tundra river valley, tundra walking trails, and historic archaeological sites."
      },
      {
        name: "Apex (Niaqunngut) & Hudson's Bay Company Buildings",
        lat: 63.7258,
        lng: -68.4552,
        category: "History / Film Location",
        description: "Historic settlement area near Apex Beach with historic red-and-white HBC buildings."
      },
      {
        name: "Astro Hill Complex",
        lat: 63.7495,
        lng: -68.5123,
        category: "Local Spot",
        description: "Hub featuring residential quarters, shops, and local services."
      }
    ];

    // Add markers for each landmark
    landmarks.forEach(place => {
      L.marker([place.lat, place.lng])
        .addTo(map)
        .bindPopup(`
          <div style="max-width: 200px;">
            <h3 style="margin: 0 0 5px 0;">${place.name}</h3>
            <span style="font-size: 0.8rem; color: #666; font-weight: bold;">[${place.category}]</span>
            <p style="margin: 8px 0 0 0; font-size: 0.9rem;">${place.description}</p>
          </div>
        `);
    });
  </script>
</body>
</html>
