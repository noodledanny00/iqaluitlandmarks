<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqaluit Landmark Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-10 shrink-0 shadow-lg">
        <!-- Title Section -->
        <div class="flex items-center gap-3">
            <div class="bg-cyan-500 text-slate-950 p-2.5 rounded-xl flex items-center justify-center font-bold shadow-md shadow-cyan-500/20">
                <i class="fa-solid fa-compass text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-extrabold tracking-tight text-white">Iqaluit Landmark Explorer</h1>
                    <span class="bg-cyan-950 text-cyan-400 border border-cyan-800/60 text-[10px] font-bold px-2 py-0.5 rounded-full">
                        Δᖃᓗᐃᑦ
                    </span>
                </div>
                <p class="text-xs text-slate-400 font-medium flex items-center gap-1 mt-0.5">
                    <i class="fa-solid fa-location-dot text-cyan-400 text-[10px]"></i> Nunavut, Canada
                </p>
            </div>
        </div>

        <!-- Action Buttons in Top Right Row -->
        <div class="flex items-center gap-3">
            <!-- Add Place Button -->
            <button onclick="handleAddPlaceClick()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-md shadow-cyan-500/10 active:scale-95">
                <i class="fa-solid fa-plus text-sm"></i> Add Place
            </button>

            <!-- Inline Google Sign In Button -->
            <button onclick="signIn('Google')" class="bg-white hover:bg-slate-100 text-slate-900 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-sm active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Google
            </button>

            <!-- Inline Microsoft Sign In Button -->
            <button onclick="signIn('Microsoft')" class="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700/80 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 23 23">
                    <path fill="#f35325" d="M1 1h10v10H1z"/>
                    <path fill="#81bc06" d="M12 1h10v10H12z"/>
                    <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                    <path fill="#ffba08" d="M12 12h10v10H12z"/>
                </svg>
                Microsoft
            </button>

            <!-- Signed In Badge (Hidden by default) -->
            <div id="user-badge" class="hidden bg-emerald-950/80 text-emerald-400 border border-emerald-800/80 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                <span id="user-name">Signed In</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="w-full md:w-80 lg:w-96 bg-slate-900/95 border-r border-slate-800 flex flex-col z-10 shrink-0 h-1/2 md:h-full">
            <!-- Search & Filters -->
            <div class="p-3 border-b border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" onkeyup="filterLandmarks()" placeholder="Search landmarks..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                    <button id="tab-all" onclick="setCategoryFilter('all')" class="filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition">All</button>
                    <button id="tab-sight" onclick="setCategoryFilter('sight')" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">Sights</button>
                    <button id="tab-snack" onclick="setCategoryFilter('snack')" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">Snacks & Food</button>
                </div>
            </div>

            <!-- Landmark List Container -->
            <div id="landmark-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
                <!-- Cards render dynamically -->
            </div>
        </aside>

        <!-- Interactive Map -->
        <section class="flex-1 relative h-1/2 md:h-full bg-slate-950">
            <div id="map" class="w-full h-full"></div>
        </section>
    </main>

    <!-- Add Place Modal -->
    <div id="add-place-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-slate-100">Add New Landmark</h3>
            <form onsubmit="addNewPlace(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Name</label>
                    <input type="text" id="add-name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Category</label>
                    <select id="add-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                        <option value="sight">Sight</option>
                        <option value="snack">Snack & Food</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Address</label>
                    <input type="text" id="add-address" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Latitude</label>
                        <input type="number" step="any" id="add-lat" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Longitude</label>
                        <input type="number" step="any" id="add-lng" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Image URL</label>
                    <input type="url" id="add-img" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white text-xs font-medium hover:bg-cyan-500">Save Place</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentUser = null;
        let markersGroup = [];
        let activeMarker = null;
        let currentCategory = 'all';
        let map = null;

        const defaultIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const selectedIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const defaultLandmarks = [
            {
                id: 1,
                name: "Black Heart Café",
                category: "snack",
                address: "Building 756, Iqaluit, NU",
                lat: 63.7461,
                lng: -68.5173,
                img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24",
                note: "We are hard-working, thirsty folk with big hearts...they just happen to be black."
            },
            {
                id: 2,
                name: "Frobisher Inn",
                category: "snack",
                address: "Astro Hill Complex, Iqaluit, NU",
                lat: 63.7475,
                lng: -68.5141,
                img: "https://www.frobisherinn.com/files/4527/frobisher_inn_colour.png",
                note: "Enjoy the outdoor adventures in the crisp air with a trail hike, snowmobile ride or kayak blade."
            },
            {
                id: 3,
                name: "Astro Theatre",
                category: "sight",
                address: "Astro Hill Complex, Iqaluit, NU",
                lat: 63.7478,
                lng: -68.5144,
                img: "https://astrotheatre.ca/wp-content/uploads/2014/05/AstroTheatre-Logo_blue_web_phone_403px-4.png",
                note: "The Astro Hill Complex structure in Iqaluit, Nunavut."
            },
            {
                id: 4,
                name: "CBC Nunavut",
                category: "sight",
                address: "Building 224, Iqaluit, NU",
                lat: 63.7452,
                lng: -68.5155,
                img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167"
            },
            {
                id: 5,
                name: "Northern/Northmart",
                category: "snack",
                address: "Aqqaluk Rd, Iqaluit, NU",
                lat: 63.7481,
                lng: -68.5189,
                img: "https://northmart.ca/wp-content/uploads/2025/03/ncr_brandHead.svg"
            },
            {
                id: 6,
                name: "Legislative Assembly of Nunavut",
                category: "sight",
                address: "926 Unikkaarvik Rd",
                lat: 63.7495,
                lng: -68.5162,
                img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9"
            },
            {
                id: 7,
                name: "Unikkaarvik Visitor Centre",
                category: "sight",
                address: "220 Unikkaarvik Rd",
                lat: 63.7438,
                lng: -68.5150,
                img: "https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1"
            },
            {
                id: 8,
                name: "St. Jude's Anglican Cathedral",
                category: "sight",
                address: "Mattaaq St",
                lat: 63.7463,
                lng: -68.5147,
                img: "https://images.unsplash.com/photo-1548625149-fc4a29cf7092",
                note: "St. Jude's Cathedral is the Anglican cathedral in Iqaluit, Nunavut."
            }
        ];

        let landmarks = JSON.parse(localStorage.getItem('iqaluit_landmarks')) || defaultLandmarks;

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map').setView([63.7467, -68.5170], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            map.on('popupclose', () => {
                if (activeMarker) {
                    activeMarker.setIcon(defaultIcon);
                    activeMarker = null;
                }
            });

            renderLandmarks();
        });

        function openAddModal() {
            document.getElementById('add-place-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-place-modal').classList.add('hidden');
        }

        function handleAddPlaceClick() {
            if (!currentUser) {
                alert("Please sign in with Google or Microsoft first using the buttons in the header!");
            } else {
                openAddModal();
            }
        }

        function signIn(provider) {
            currentUser = { provider: provider, name: provider + " User" };
            document.getElementById('user-name').innerText = "Signed in with " + provider;
            document.getElementById('user-badge').classList.remove('hidden');
            openAddModal();
        }

        function saveLandmarksToStorage() {
            localStorage.setItem('iqaluit_landmarks', JSON.stringify(landmarks));
        }

        function addNewPlace(event) {
            event.preventDefault();
            const newPlace = {
                id: Date.now(),
                name: document.getElementById('add-name').value,
                category: document.getElementById('add-category').value,
                img: document.getElementById('add-img').value || 'https://images.unsplash.com/photo-1517411032315-54ef2cb783bb',
                address: document.getElementById('add-address').value,
                lat: parseFloat(document.getElementById('add-lat').value),
                lng: parseFloat(document.getElementById('add-lng').value)
            };
            landmarks.push(newPlace);
            saveLandmarksToStorage();
            closeAddModal();
            renderLandmarks();
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.className = "filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition";
            });
            const activeTab = document.getElementById(`tab-${category}`);
            if (activeTab) {
                activeTab.className = "filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition";
            }
            renderLandmarks();
        }

        function filterLandmarks() {
            renderLandmarks();
        }

        function focusLandmark(id) {
            const place = landmarks.find(p => p.id === id);
            if (place && map) {
                map.setView([place.lat, place.lng], 15);
                const marker = markersGroup.find(m => m.options.landmarkId === id);
                if (marker) {
                    marker.openPopup();
                }
            }
        }

        function renderLandmarks() {
            const list = document.getElementById('landmark-list');
            const searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase();
            list.innerHTML = '';

            if (map) {
                markersGroup.forEach(marker => map.removeLayer(marker));
            }
            markersGroup = [];

            const filtered = landmarks.filter(place => {
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                const matchesSearch = place.name.toLowerCase().includes(searchQuery) || place.address.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(place => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3 flex gap-3 cursor-pointer transition";
                card.onclick = () => focusLandmark(place.id);

                card.innerHTML = `
                    <div class="relative w-16 h-16 rounded-lg overflow-hidden bg-slate-900 shrink-0">
                        <img src="${place.img}" alt="${place.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-xs text-slate-100 truncate">${place.name}</h4>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5"><i class="fa-solid fa-location-dot text-cyan-400 text-[10px] mr-1"></i>${place.address}</p>
                        ${place.note ? `<p class="text-[10px] text-slate-300 mt-1 line-clamp-2">${place.note}</p>` : ''}
                    </div>
                `;
                list.appendChild(card);

                if (map) {
                    const marker = L.marker([place.lat, place.lng], { icon: defaultIcon, landmarkId: place.id }).addTo(map);
                    let popupContent = `
                        <div class="space-y-2 max-w-[200px]">
                            <img src="${place.img}" class="w-full h-24 object-cover rounded-lg">
                            <h4 class="font-bold text-sm text-slate-100">${place.name}</h4>
                            <p class="text-xs text-slate-300">${place.address}</p>
                            ${place.note ? `<p class="text-xs text-slate-400 italic">${place.note}</p>` : ''}
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    marker.on('click', () => {
                        if (activeMarker) activeMarker.setIcon(defaultIcon);
                        marker.setIcon(selectedIcon);
                        activeMarker = marker;
                    });
                    markersGroup.push(marker);
                }
            });
        }
    </script>
</body>
</html>
