<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="google-site-verification" content="YZ4j7urjkTDUD1dgqrWZSp2m0YSa3E9QcQ3Exyy09RE" />
   <title>Iqaluit Landmark Explorer - Interactive Map</title>
   <!-- Tailwind CSS -->
   <script src="https://cdn.tailwindcss.com"></script>
   <!-- Leaflet CSS -->
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
   <!-- Leaflet JS -->
   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   <!-- FontAwesome Icons -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <!-- Inter Font -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <!-- MSAL.js Browser SDK for Microsoft Auth -->
   <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

   <script>
       tailwind.config = {
           darkMode: 'class',
           theme: {
               extend: {
                   colors: {
                       arctic: {
                           50: '#f0f9ff',
                           100: '#e0f2fe',
                           200: '#bae6fd',
                           500: '#0284c7',
                           800: '#075985',
                           900: '#0c4a6e',
                           950: '#082f49',
                       }
                   },
                   fontFamily: {
                       sans: ['Inter', 'sans-serif'],
                   }
               }
           }
       }
   </script>
   <style>
       body { font-family: 'Inter', sans-serif; }
       #map { width: 100%; height: 100%; z-index: 1; }
       .leaflet-popup-content-wrapper {
           background: rgba(15, 23, 42, 0.95);
           backdrop-filter: blur(12px);
           color: #f8fafc;
           border: 1px solid rgba(56, 189, 248, 0.3);
           border-radius: 1rem;
           box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
           padding: 4px;
       }
       .leaflet-popup-tip {
           background: rgba(15, 23, 42, 0.95);
           border: 1px solid rgba(56, 189, 248, 0.3);
       }
       .leaflet-popup-content { margin: 12px 14px; line-height: 1.5; }
       ::-webkit-scrollbar { width: 6px; height: 6px; }
       ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
       ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 3px; }
       ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.7); }
   </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden select-none">

   <!-- Hidden File Input for Direct Local Image Selection without Sign-In -->
   <input type="file" id="change-image-file-input" accept="image/*" class="hidden" onchange="processImageFileChange(event)">

   <!-- Top Navigation Header -->
   <header class="h-16 bg-slate-900/90 border-b border-slate-800 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
       <div class="flex items-center space-x-3">
           <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-sky-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
               <i class="fa-solid fa-compass text-slate-950 text-xl"></i>
           </div>
           <div>
               <h1 class="font-bold text-lg text-slate-100 leading-tight flex items-center gap-2">
                   Iqaluit Landmark Explorer
                   <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800/50">ᐃᖃᓗᐃᑦ</span>
               </h1>
               <p class="text-xs text-slate-400 flex items-center gap-2">
                   <span><i class="fa-solid fa-map-pin text-cyan-400 text-[10px]"></i> Nunavut, Canada</span>
               </p>
           </div>
       </div>

       <div class="flex items-center gap-2">
           <button onclick="handleAddPlaceClick()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold text-xs px-3.5 py-2 rounded-xl border border-cyan-400/30 transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
               <i class="fa-solid fa-plus text-sm"></i>
               <span class="hidden sm:inline">Add Place</span>
           </button>

           <button id="auth-btn" onclick="handleAuthClick()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-medium px-3.5 py-2 rounded-xl border border-slate-700 transition flex items-center gap-2">
               <i class="fa-brands fa-microsoft text-sky-400 text-sm"></i>
               <span id="auth-user-label" class="hidden sm:inline">Sign In</span>
           </button>
       </div>
   </header>

   <!-- Main Map Workspace -->
   <div class="flex-1 flex relative overflow-hidden">
       <aside id="sidebar" class="w-full md:w-96 bg-slate-900/95 backdrop-blur-xl border-r border-slate-800 flex flex-col z-10">
           <div class="p-4 border-b border-slate-800 space-y-3">
               <input type="text" id="search-input" onkeyup="filterLandmarks()" placeholder="Search landmarks..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">

               <!-- Category Filter Tabs -->
               <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                   <button onclick="setCategoryFilter('all')" id="tab-all" class="filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition">
                       <i class="fa-solid fa-border-all mr-1"></i> All
                   </button>
                   <button onclick="setCategoryFilter('snack')" id="tab-snack" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">
                       <i class="fa-solid fa-mug-hot mr-1 text-amber-400"></i> Snacks & Coffee
                   </button>
                   <button onclick="setCategoryFilter('sight')" id="tab-sight" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">
                       <i class="fa-solid fa-camera mr-1 text-cyan-400"></i> Sights
                   </button>
               </div>
           </div>
           <div class="flex-1 overflow-y-auto p-4 space-y-3" id="landmark-list"></div>
       </aside>

       <main class="flex-1 relative">
           <div id="map"></div>
       </main>
   </div>

   <!-- AUTH MODAL -->
   <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
       <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 relative text-center">
           <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
           <div class="w-12 h-12 rounded-2xl bg-cyan-950 border border-cyan-700 flex items-center justify-center text-cyan-400 text-xl mx-auto mb-2">
               <i class="fa-brands fa-microsoft"></i>
           </div>
           <h3 class="text-lg font-bold text-slate-100">Sign In to Add Places</h3>
           <p class="text-xs text-slate-400">You can explore the map freely, but you must sign in with a Microsoft account to add new landmarks.</p>
           <button onclick="loginWithMicrosoft()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2">
               <i class="fa-brands fa-microsoft"></i> Sign In with Microsoft
           </button>
       </div>
   </div>

   <!-- ADD NEW PLACE MODAL -->
   <div id="add-place-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
       <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-3 overflow-y-auto max-h-[90vh]">
           <div class="flex justify-between items-center border-b border-slate-800 pb-2">
               <h3 class="font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-circle-plus text-cyan-400"></i> Add New Landmark</h3>
               <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
           </div>
           <form onsubmit="addNewPlace(event)" class="space-y-3">
               <div>
                   <label class="text-[11px] font-semibold text-slate-400">Landmark Name *</label>
                   <input type="text" id="add-name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
               </div>
               <div>
                   <label class="text-[11px] font-semibold text-slate-400">Category *</label>
                   <select id="add-category" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                       <option value="sight">Sightseeing</option>
                       <option value="snack">Snacks & Coffee</option>
                   </select>
               </div>
               <div>
                   <label class="text-[11px] font-semibold text-slate-400">Upload Image</label>
                   <div class="flex gap-2 mt-1">
                       <input type="url" id="add-img" placeholder="https://..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                       <label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 text-xs px-3 py-2 rounded-lg cursor-pointer shrink-0">
                           <i class="fa-solid fa-upload"></i> Browse...
                           <input type="file" accept="image/*" onchange="handleFileUpload(event, 'add-img')" class="hidden">
                       </label>
                   </div>
               </div>
               <div>
                   <label class="text-[11px] font-semibold text-slate-400">Address *</label>
                   <input type="text" id="add-address" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
               </div>
               <div class="grid grid-cols-2 gap-2">
                   <div>
                       <label class="text-[11px] font-semibold text-slate-400">Latitude</label>
                       <input type="number" id="add-lat" step="any" value="63.7467" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                   </div>
                   <div>
                       <label class="text-[11px] font-semibold text-slate-400">Longitude</label>
                       <input type="number" id="add-lng" step="any" value="-68.5170" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                   </div>
               </div>
               <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg mt-2">Save Location</button>
           </form>
       </div>
   </div>

   <!-- CHANGE IMAGE MODAL (Free, No Sign-In Required) -->
   <div id="change-image-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
       <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 relative">
           <button onclick="closeChangeImageModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
           <h3 class="font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-image text-cyan-400"></i> Change Image (Free)</h3>
           <div class="space-y-3">
               <div>
                   <label class="text-[11px] font-semibold text-slate-400">Image URL</label>
                   <input type="url" id="modal-image-url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 mt-1">
               </div>
               <div class="text-center text-xs text-slate-500 font-semibold">- OR -</div>
               <button onclick="document.getElementById('change-image-file-input').click()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 font-semibold text-xs py-2 rounded-xl transition flex items-center justify-center gap-2">
                   <i class="fa-solid fa-upload"></i> Upload Image File
               </button>
               <button onclick="saveImageChangeFromModal()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg mt-2">Save New Picture</button>
           </div>
       </div>
   </div>

   <!-- JS LOGIC -->

           {
               id: 12,
               name: "Iqaluit International Airport",
               category: "sight",
               address: "Airport Rd, Iqaluit, NU",
               lat: 63.7564,
               lng: -68.5559,
               img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05",
               note: "Iqaluit international airport is a great place to book flights and see many great workers. Maybe you can book the next trip to Iqaluit!",
               airportLinks: {
                   official: "https://www.iqaluitairport.ca/",
                   airline: "https://canadiannorth.com/"
               }
           }
       ];

       let landmarks = JSON.parse(localStorage.getItem('iqaluit_landmarks')) || defaultLandmarks;

       msalInstance.initialize().then(() => {
           const accounts = msalInstance.getAllAccounts();
           if (accounts.length > 0) {
               currentUser = accounts[0];
           }
           updateUIForUser();
       });

       function handleAddPlaceClick() {
           if (!currentUser) { openAuthModal(); } else { openAddModal(); }
       }

       function handleAuthClick() {
           if (currentUser) {
               msalInstance.logoutPopup().then(() => {
                   currentUser = null;
                   updateUIForUser();
               });
           } else {
               loginWithMicrosoft();
           }
       }

       async function loginWithMicrosoft() {
           try {
               const loginResponse = await msalInstance.loginPopup({ scopes: ["User.Read"] });
               currentUser = loginResponse.account;
               updateUIForUser();
               closeAuthModal();
               openAddModal();
           } catch (error) {
               console.error("Microsoft Login Error:", error);
           }
       }

       function updateUIForUser() {
           const authLabel = document.getElementById('auth-user-label');
           authLabel.innerText = currentUser ? (currentUser.name || "Signed In") : "Sign In";
       }

       function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
       function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
       function openAddModal() { document.getElementById('add-place-modal').classList.remove('hidden'); }
       function closeAddModal() { document.getElementById('add-place-modal').classList.add('hidden'); }

       // Free Image Changing Functions (No Sign-In Required)
       function triggerImageChange(landmarkId, event) {
           if(event) event.stopPropagation();
           targetLandmarkIdForImage = landmarkId;
           document.getElementById('modal-image-url').value = '';
           document.getElementById('change-image-modal').classList.remove('hidden');
       }

       function closeChangeImageModal() {
           document.getElementById('change-image-modal').classList.add('hidden');
           targetLandmarkIdForImage = null;
       }

       function saveImageChangeFromModal() {
           const newUrl = document.getElementById('modal-image-url').value.trim();
           if (newUrl && targetLandmarkIdForImage) {
               updateLandmarkImage(targetLandmarkIdForImage, newUrl);
               closeChangeImageModal();
           }
       }

       function processImageFileChange(event) {
           const file = event.target.files[0];
           if (file && targetLandmarkIdForImage) {
               const reader = new FileReader();
               reader.onload = function(e) {
                   updateLandmarkImage(targetLandmarkIdForImage, e.target.result);
                   closeChangeImageModal();
               };
               reader.readAsDataURL(file);
           }
           event.target.value = '';
       }

       function updateLandmarkImage(landmarkId, newImgSrc) {
           const place = landmarks.find(p => p.id === landmarkId);
           if (place) {
               place.img = newImgSrc;
               saveLandmarksToStorage();
               renderLandmarks();
           }
       }

       function handleFileUpload(event, targetInputId) {
           const file = event.target.files[0];
           if (file) {
               const reader = new FileReader();
               reader.onload = function(e) {
                   document.getElementById(targetInputId).value = e.target.result;
               };
               reader.readAsDataURL(file);
           }
       }

       // Initialize Map
       const map = L.map('map').setView([63.7467, -68.5170], 13);
       L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

       map.on('popupclose', () => {
           if (activeMarker) {
               activeMarker.setIcon(defaultIcon);
               activeMarker = null;
           }
       });

       function saveLandmarksToStorage() {
           localStorage.setItem('iqaluit_landmarks', JSON.stringify(landmarks));
       }

       function addNewPlace(event) {
           event.preventDefault();
           const newPlace = {
               id: Date.now(),
               name: document.getElementById('add-name').value,
               category: document.getElementById('add-category').value,
               img: document.getElementById('add-img').value || 'https://images.unsplash.com/photo-1517411032315-54ef2cb783bb',
               address: document.getElementById('add-address').value,
               lat: parseFloat(document.getElementById('add-lat').value),
               lng: parseFloat(document.getElementById('add-lng').value)
           };
           landmarks.push(newPlace);
           saveLandmarksToStorage();
           closeAddModal();
           renderLandmarks();
       }

       function setCategoryFilter(category) {
           currentCategory = category;
           document.querySelectorAll('.filter-tab').forEach(btn => {
               btn.className = "filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition";
           });
           const activeTab = document.getElementById(`tab-${category}`);
           if (activeTab) {
               activeTab.className = "filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition";
           }
           renderLandmarks();
       }

       function renderLandmarks() {
           const list = document.getElementById('landmark-list');
           list.innerHTML = '';

           markersGroup.forEach(marker => map.removeLayer(marker));
           markersGroup = [];

           const filteredLandmarks = landmarks.filter(place => {
               if (currentCategory === 'all') return true;
               return (place.category || 'sight') === currentCategory;
           });

           filteredLandmarks.forEach(place => {
               const fallbackImg = 'https://images.unsplash.com/photo-1517411032315-54ef2cb783bb';
               const imageSrc = place.img || fallbackImg;
               const isSnack = place.category === 'snack';

               let extraHtml = '';
               if (place.note) {
                   extraHtml += `<p class="text-[11px] text-cyan-200 bg-slate-800/80 p-1.5 rounded border border-slate-700/50 mt-1">${place.note}</p>`;
               }
               if (place.airportLinks) {
                   extraHtml += `
                       <div class="flex flex-col gap-1 mt-1 text-[11px]">
                           <a href="${place.airportLinks.official}" target="_blank" class="text-sky-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-globe"></i> Official Airport Site</a>
                           <a href="${place.airportLinks.airline}" target="_blank" class="text-sky-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-plane"></i> Canadian North Airlines</a>
                       </div>
                   `;
               }

               const popupContent = `
                   <div class="space-y-1.5 max-w-[220px]">
                       <div class="relative group">
                           <img src="${imageSrc}" onerror="this.src='${fallbackImg}'" class="w-full h-24 object-cover rounded-lg border border-slate-700/50 mb-1" alt="${place.name}" />
                           <button onclick="triggerImageChange(${place.id}, event)" class="absolute top-1 right-1 bg-slate-900/80 hover:bg-slate-900 text-cyan-300 border border-slate-700 px-1.5 py-0.5 rounded text-[10px]">
                               <i class="fa-solid fa-camera"></i> Change
                           </button>
                       </div>
                       <b class="text-cyan-300 text-sm block leading-tight">${place.name}</b>
                       <p class="text-xs text-slate-300">${place.address}</p>
                       ${isSnack ? '<span class="inline-block mt-1 text-[10px] bg-amber-950 text-amber-400 border border-amber-800/50 px-2 py-0.5 rounded-full"><i class="fa-solid fa-mug-hot mr-1"></i>Snack & Coffee Spot</span>' : ''}
                       ${extraHtml}
                   </div>
               `;

               const marker = L.marker([place.lat, place.lng], { icon: defaultIcon }).addTo(map).bindPopup(popupContent);

               marker.on('click', () => {
                   if (activeMarker && activeMarker !== marker) activeMarker.setIcon(defaultIcon);
                   marker.setIcon(selectedIcon);
                   activeMarker = marker;
               });

               markersGroup.push(marker);

               const card = document.createElement('div');
               card.className = "bg-slate-950 border border-slate-800 hover:border-cyan-500/50 rounded-xl p-3 text-xs space-y-2 transition cursor-pointer flex items-center gap-3 relative group";
               card.onclick = () => {
                   map.flyTo([place.lat, place.lng], 15);
                   if (activeMarker && activeMarker !== marker) activeMarker.setIcon(defaultIcon);
                   marker.setIcon(selectedIcon);
                   activeMarker = marker;
                   marker.openPopup();
               };
               card.innerHTML = `
                   <div class="relative shrink-0">
                       <img src="${imageSrc}" onerror="this.src='${fallbackImg}'" class="w-12 h-12 rounded-lg object-cover border border-slate-800" alt="${place.name}" />
                       <button onclick="triggerImageChange(${place.id}, event)" title="Change Picture" class="absolute -bottom-1 -right-1 bg-slate-900 border border-slate-700 text-cyan-300 rounded-full w-5 h-5 flex items-center justify-center text-[9px] hover:bg-cyan-600 hover:text-white transition">
                           <i class="fa-solid fa-camera"></i>
                       </button>
                   </div>
                   <div class="min-w-0 flex-1">
                       <div class="flex items-center gap-1.5">
                           <h4 class="font-bold text-cyan-400 truncate">${place.name}</h4>
                           ${isSnack ? '<i class="fa-solid fa-mug-hot text-amber-400 text-[10px]" title="Snack & Coffee Spot"></i>' : ''}
                       </div>
                       <p class="text-slate-400 truncate">${place.address}</p>
                   </div>
               `;
               list.appendChild(card);
           });
           filterLandmarks();
       }

       function filterLandmarks() {
           const query = document.getElementById('search-input').value.toLowerCase();
           const cards = document.getElementById('landmark-list').children;

           const visibleLandmarks = landmarks.filter(place => {
               if (currentCategory === 'all') return true;
               return (place.category || 'sight') === currentCategory;
           });

           visibleLandmarks.forEach((place, index) => {
               const matches = place.name.toLowerCase().includes(query) || place.address.toLowerCase().includes(query);
               if (cards[index]) {
                   cards[index].style.display = matches ? 'flex' : 'none';
               }
           });
       }

       renderLandmarks();
   </script>
</body>
</html>
