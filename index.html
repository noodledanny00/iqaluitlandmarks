<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqaluit Landmarks Map</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Microsoft MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-map-location-dot text-cyan-400 text-xl"></i>
            <h1 class="text-lg font-bold tracking-wide">Iqaluit Landmarks</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="handleAddPlaceClick()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-plus"></i> Add Place
            </button>
            <button onclick="handleAuthClick()" id="auth-user-label" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                Sign In
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="w-full md:w-80 lg:w-96 bg-slate-900/95 border-r border-slate-800 flex flex-col z-10 shrink-0 h-1/2 md:h-full">
            <!-- Search & Filters -->
            <div class="p-3 border-b border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" onkeyup="filterLandmarks()" placeholder="Search landmarks..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                    <button id="tab-all" onclick="setCategoryFilter('all')" class="filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition">All</button>
                    <button id="tab-sight" onclick="setCategoryFilter('sight')" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">Sights</button>
                    <button id="tab-snack" onclick="setCategoryFilter('snack')" class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition">Snacks & Food</button>
                </div>
            </div>

            <!-- Landmark List Container -->
            <div id="landmark-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
                <!-- Cards render dynamically -->
            </div>
        </aside>

        <!-- Interactive Map -->
        <section class="flex-1 relative h-1/2 md:h-full bg-slate-950">
            <div id="map" class="w-full h-full"></div>
        </section>
    </main>

    <!-- Auth Modal (Both Google & Microsoft Options) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full space-y-4">
            <h3 class="text-base font-bold text-slate-100">Sign In</h3>
            <p class="text-xs text-slate-400">Choose a provider to sign in and add new landmarks:</p>
            
            <div class="flex flex-col items-center gap-3 py-2 w-full">
                <!-- Google Sign-In Button Container -->
                <div id="google-signin-btn" class="w-full flex justify-center"></div>

                <div class="flex items-center my-1 w-full">
                    <div class="flex-1 border-t border-slate-800"></div>
                    <span class="px-2 text-[10px] text-slate-500 uppercase">or</span>
                    <div class="flex-1 border-t border-slate-800"></div>
                </div>

                <!-- Microsoft Sign-In Button -->
                <button onclick="signInWithMicrosoft()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-medium text-xs px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 transition">
                    <svg class="w-4 h-4" viewBox="0 0 23 23">
                        <path fill="#f35325" d="M1 1h10v10H1z"/>
                        <path fill="#81bc06" d="M12 1h10v10H12z"/>
                        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                        <path fill="#ffba08" d="M12 12h10v10H12z"/>
                    </svg>
                    Sign in with Microsoft
                </button>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAuthModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Place Modal -->
    <div id="add-place-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-base font-bold text-slate-100">Add New Landmark</h3>
            <form onsubmit="addNewPlace(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Name</label>
                    <input type="text" id="add-name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Category</label>
                    <select id="add-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                        <option value="sight">Sight</option>
                        <option value="snack">Snack & Food</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Address</label>
                    <input type="text" id="add-address" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Latitude</label>
                        <input type="number" step="any" id="add-lat" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Longitude</label>
                        <input type="number" step="any" id="add-lng" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Image URL</label>
                    <input type="url" id="add-img" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    <p class="text-[10px] text-slate-500 mt-1">Or upload an image file:</p>
                    <input type="file" accept="image/*" onchange="handleFileUpload(event, 'add-img')" class="mt-1 text-slate-400 text-[10px]">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white text-xs font-medium hover:bg-cyan-500">Save Place</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Image Modal -->
    <div id="change-image-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full space-y-4">
            <h3 class="text-base font-bold text-slate-100">Update Photo</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Image URL</label>
                    <input type="url" id="modal-image-url" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Upload File</label>
                    <input type="file" accept="image/*" onchange="processImageFileChange(event)" class="w-full text-slate-400 text-[10px]">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeChangeImageModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700">Cancel</button>
                <button onclick="saveImageChangeFromModal()" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white text-xs font-medium hover:bg-cyan-500">Update</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const GOOGLE_CLIENT_ID = "600276701886-fpqunmts8eq2t1an0i8efj8fkegfi0iu.apps.googleusercontent.com";
        const MICROSOFT_CLIENT_ID = "YOUR_MICROSOFT_CLIENT_ID"; // Replace with your Azure App Registration ID if needed

        let msalInstance = null;
        let currentUser = null;
        let markersGroup = [];
        let activeMarker = null;
        let currentCategory = 'all';
        let targetLandmarkIdForImage = null;
        let map = null;

        // Leaflet Pin Icons
        const defaultIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const selectedIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Default landmarks dataset
        const defaultLandmarks = [
            {
                id: 1,
                name: "Black Heart Café",
                category: "snack",
                address: "Building 756, Iqaluit, NU",
                lat: 63.7461,
                lng: -68.5173,
                img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24",
                note: "We are hard-working, thirsty folk with big hearts...they just happen to be black.",
                officialLink: "http://www.facebook.com/BlackHeartCafe/"
            },
            {
                id: 2,
                name: "Frobisher Inn",
                category: "snack",
                address: "Astro Hill Complex, Iqaluit, NU",
                lat: 63.7475,
                lng: -68.5141,
                img: "https://www.frobisherinn.com/files/4527/frobisher_inn_colour.png",
                note: "Enjoy the outdoor adventures in the crisp air with a trail hike, snowmobile ride or a watery swoosh of a kayak blade.",
                officialLink: "https://www.frobisherinn.com/"
            },
            {
                id: 3,
                name: "Astro Theatre",
                category: "sight",
                address: "Astro Hill Complex, Iqaluit, NU",
                lat: 63.7478,
                lng: -68.5144,
                img: "https://astrotheatre.ca/wp-content/uploads/2014/05/AstroTheatre-Logo_blue_web_phone_403px-4.png",
                note: "The Astro Hill Complex structure in Iqaluit, Nunavut.",
                officialLink: "https://astrotheatre.ca/"
            },
            {
                id: 4,
                name: "CBC Nunavut",
                category: "sight",
                address: "Building 224, Iqaluit, NU",
                lat: 63.7452,
                lng: -68.5155,
                img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167"
            },
            {
                id: 5,
                name: "Northern/Northmart",
                category: "snack",
                address: "Aqqaluk Rd, Iqaluit, NU",
                lat: 63.7481,
                lng: -68.5189,
                img: "https://northmart.ca/wp-content/uploads/2025/03/ncr_brandHead.svg",
                officialLink: "https://northmart.ca/"
            },
            {
                id: 6,
                name: "Legislative Assembly of Nunavut",
                category: "sight",
                address: "926 Unikkaarvik Rd",
                lat: 63.7495,
                lng: -68.5162,
                img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9",
                officialLink: "http://www.assembly.nu.ca/"
            },
            {
                id: 7,
                name: "Unikkaarvik Visitor Centre",
                category: "sight",
                address: "220 Unikkaarvik Rd",
                lat: 63.7438,
                lng: -68.5150,
                img: "https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1",
                officialLink: "https://www.facebook.com/Unikkaarvik/"
            },
            {
                id: 8,
                name: "St. Jude's Anglican Cathedral",
                category: "sight",
                address: "Mattaaq St",
                lat: 63.7463,
                lng: -68.5147,
                img: "https://images.unsplash.com/photo-1548625149-fc4a29cf7092",
                note: "St. Jude's Cathedral is the Anglican cathedral in Iqaluit, Nunavut. The cathedral is the seat of the Diocese of The Arctic.",
                officialLink: "https://iqaluitcathedral.ca/"
            },
            {
                id: 9,
                name: "Akausisarvik Mental Health Facility",
                category: "sight",
                address: "503 Niaqunngusiariaq, Iqaluit, NU",
                lat: 63.7505,
                lng: -68.5080,
                img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d",
                note: "Akausisarvik Mental Health Facility provides community health and mental health support services."
            },
            {
                id: 10,
                name: "Inuksuk High School",
                category: "sight",
                address: "501 Niaqunngusiariaq, Iqaluit, NU",
                lat: 63.7492,
                lng: -68.5139,
                img: "https://images.unsplash.com/photo-1580582932707-520aed937b7b",
                note: "Inuksuk High School is the high school of Iqaluit, Nunavut.",
                officialLink: "https://www.facebook.com/inuksukhighschool/"
            },
            {
                id: 11,
                name: "Stay By The Sea",
                category: "sight",
                address: "2536 Paurngaq, Iqaluit, NU",
                lat: 63.7402,
                lng: -68.5125,
                img: "https://images.unsplash.com/photo-1566073771259-6a8506099945",
                note: "Stay By The Sea is a 2-story boutique retreat and B&B located on a scenic hillside overlooking Frobisher Bay.",
                officialLink: "https://www.staybythesea.ca/"
            },
            {
                id: 12,
                name: "Iqaluit International Airport",
                category: "sight",
                address: "Airport Rd, Iqaluit, NU",
                lat: 63.7564,
                lng: -68.5559,
                img: "https://www.iqaluitairport.ca/sites/default/files/styles/header/public/2025-06/YFB-Terminal%20airside_header.jpg?itok=AJYII8Yy",
                note: "Iqaluit International Airport is a great place to book flights and explore travel options.",
                airportLinks: {
                    official: "https://www.iqaluitairport.ca/",
                    airline: "https://canadiannorth.com/"
                }
            }
        ];

        let landmarks = JSON.parse(localStorage.getItem('iqaluit_landmarks')) || defaultLandmarks;

        // Parse JWT payload from Google token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // Google Sign-In Callback
        function handleCredentialResponse(response) {
            const userData = parseJwt(response.credential);
            if (userData) {
                currentUser = {
                    provider: 'Google',
                    name: userData.name,
                    email: userData.email,
                    picture: userData.picture
                };
                updateUIForUser();
                closeAuthModal();
                openAddModal();
            }
        }

        // Microsoft Sign-In
        async function signInWithMicrosoft() {
            if (!msalInstance) {
                const msalConfig = {
                    auth: {
                        clientId: MICROSOFT_CLIENT_ID,
                        authority: "https://login.microsoftonline.com/common"
                    }
                };
                msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();
            }

            try {
                const loginResponse = await msalInstance.loginPopup({
                    scopes: ["User.Read"]
                });
                currentUser = {
                    provider: 'Microsoft',
                    name: loginResponse.account.name || loginResponse.account.username,
                    email: loginResponse.account.username
                };
                updateUIForUser();
                closeAuthModal();
                openAddModal();
            } catch (error) {
                console.log("Microsoft Sign-In completed or cancelled.");
            }
        }

        // Initial setup on load
        window.addEventListener('DOMContentLoaded', () => {
            // Leaflet Map Initialization
            map = L.map('map').setView([63.7467, -68.5170], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            map.on('popupclose', () => {
                if (activeMarker) {
                    activeMarker.setIcon(defaultIcon);
                    activeMarker = null;
                }
            });

            // Google Identity Initialization
            if (window.google && google.accounts) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse
                });
            }

            renderLandmarks();
        });

        function handleAddPlaceClick() {
            if (!currentUser) { 
                openAuthModal(); 
            } else { 
                openAddModal(); 
            }
        }

        function handleAuthClick() {
            if (currentUser) {
                currentUser = null;
                updateUIForUser();
            } else {
                openAuthModal();
            }
        }

        function updateUIForUser() {
            const authLabel = document.getElementById('auth-user-label');
            authLabel.innerText = currentUser ? (currentUser.name || "Signed In") : "Sign In";
        }

        function openAuthModal() { 
            document.getElementById('auth-modal').classList.remove('hidden'); 
            if (window.google && google.accounts) {
                google.accounts.id.renderButton(
                    document.getElementById("google-signin-btn"),
                    { theme: "outline", size: "medium" }
                );
            }
        }

        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function openAddModal() { document.getElementById('add-place-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-place-modal').classList.add('hidden'); }

        function triggerImageChange(landmarkId, event) {
            if(event) event.stopPropagation();
            targetLandmarkIdForImage = landmarkId;
            document.getElementById('modal-image-url').value = '';
            document.getElementById('change-image-modal').classList.remove('hidden');
        }

        function closeChangeImageModal() {
            document.getElementById('change-image-modal').classList.add('hidden');
            targetLandmarkIdForImage = null;
        }

        function saveImageChangeFromModal() {
            const newUrl = document.getElementById('modal-image-url').value.trim();
            if (newUrl && targetLandmarkIdForImage) {
                updateLandmarkImage(targetLandmarkIdForImage, newUrl);
                closeChangeImageModal();
            }
        }

        function processImageFileChange(event) {
            const file = event.target.files[0];
            if (file && targetLandmarkIdForImage) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    updateLandmarkImage(targetLandmarkIdForImage, e.target.result);
                    closeChangeImageModal();
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function updateLandmarkImage(landmarkId, newImgSrc) {
            const place = landmarks.find(p => p.id === landmarkId);
            if (place) {
                place.img = newImgSrc;
                saveLandmarksToStorage();
                renderLandmarks();
            }
        }

        function handleFileUpload(event, targetInputId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(targetInputId).value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveLandmarksToStorage() {
            localStorage.setItem('iqaluit_landmarks', JSON.stringify(landmarks));
        }

        function addNewPlace(event) {
            event.preventDefault();
            const newPlace = {
                id: Date.now(),
                name: document.getElementById('add-name').value,
                category: document.getElementById('add-category').value,
                img: document.getElementById('add-img').value || 'https://images.unsplash.com/photo-1517411032315-54ef2cb783bb',
                address: document.getElementById('add-address').value,
                lat: parseFloat(document.getElementById('add-lat').value),
                lng: parseFloat(document.getElementById('add-lng').value)
            };
            landmarks.push(newPlace);
            saveLandmarksToStorage();
            closeAddModal();
            renderLandmarks();
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.className = "filter-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium shrink-0 transition";
            });
            const activeTab = document.getElementById(`tab-${category}`);
            if (activeTab) {
                activeTab.className = "filter-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium shrink-0 transition";
            }
            renderLandmarks();
        }

        function filterLandmarks() {
            renderLandmarks();
        }

        function focusLandmark(id) {
            const place = landmarks.find(p => p.id === id);
            if (place && map) {
                map.setView([place.lat, place.lng], 15);
                const marker = markersGroup.find(m => m.options.landmarkId === id);
                if (marker) {
                    marker.openPopup();
                }
            }
        }

        function renderLandmarks() {
            const list = document.getElementById('landmark-list');
            const searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase();
            list.innerHTML = '';

            if (map) {
                markersGroup.forEach(marker => map.removeLayer(marker));
            }
            markersGroup = [];

            const filtered = landmarks.filter(place => {
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                const matchesSearch = place.name.toLowerCase().includes(searchQuery) || place.address.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(place => {
                let linksHTML = '';
                if (place.airportLinks) {
                    linksHTML = `
                        <div class="mt-2 flex gap-2">
                            <a href="${place.airportLinks.official}" target="_blank" onclick="event.stopPropagation()" class="text-[10px] bg-cyan-900/60 text-cyan-300 border border-cyan-700/50 px-2 py-0.5 rounded hover:bg-cyan-800 transition">Official Site</a>
                            <a href="${place.airportLinks.airline}" target="_blank" onclick="event.stopPropagation()" class="text-[10px] bg-sky-900/60 text-sky-300 border border-sky-700/50 px-2 py-0.5 rounded hover:bg-sky-800 transition">Canadian North</a>
                        </div>
                    `;
                } else if (place.officialLink) {
                    linksHTML = `
                        <div class="mt-2 flex gap-2">
                            <a href="${place.officialLink}" target="_blank" onclick="event.stopPropagation()" class="text-[10px] bg-cyan-900/60 text-cyan-300 border border-cyan-700/50 px-2 py-0.5 rounded hover:bg-cyan-800 transition">Official Site</a>
                        </div>
                    `;
                }

                // Sidebar Card Item
                const card = document.createElement('div');
                card.className = "bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3 flex gap-3 cursor-pointer transition";
                card.onclick = () => focusLandmark(place.id);

                card.innerHTML = `
                    <div class="relative w-16 h-16 rounded-lg overflow-hidden bg-slate-900 shrink-0">
                        <img src="${place.img}" alt="${place.name}" class="w-full h-full object-cover">
                        <button onclick="triggerImageChange(${place.id}, event)" class="absolute bottom-1 right-1 bg-slate-950/80 text-cyan-400 p-1 rounded hover:text-white text-[10px]"><i class="fa-solid fa-camera"></i></button>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-xs text-slate-100 truncate">${place.name}</h4>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5"><i class="fa-solid fa-location-dot text-cyan-400 text-[10px] mr-1"></i>${place.address}</p>
                        ${place.note ? `<p class="text-[10px] text-slate-300 mt-1 line-clamp-2">${place.note}</p>` : ''}
                        ${linksHTML}
                    </div>
                `;
                list.appendChild(card);

                // Leaflet Map Marker
                if (map) {
                    const marker = L.marker([place.lat, place.lng], { icon: defaultIcon, landmarkId: place.id }).addTo(map);

                    let popupContent = `
                        <div class="space-y-2 max-w-[200px]">
                            <img src="${place.img}" class="w-full h-24 object-cover rounded-lg">
                            <h4 class="font-bold text-sm text-slate-100">${place.name}</h4>
                            <p class="text-xs text-slate-300">${place.address}</p>
                            ${place.note ? `<p class="text-xs text-slate-400 italic">${place.note}</p>` : ''}
                            ${linksHTML}
                        </div>
                    `;

                    marker.bindPopup(popupContent);

                    marker.on('click', () => {
                        if (activeMarker) activeMarker.setIcon(defaultIcon);
                        marker.setIcon(selectedIcon);
                        activeMarker = marker;
                    });

                    markersGroup.push(marker);
                }
            });
        }
    </script>
</body>
</html>
